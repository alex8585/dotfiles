# Prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Основное
set -g default-terminal "screen-256color"
set -g mouse on                          # раскомментировал — очень удобно
set -g base-index 1                      # окна с 1, не с 0
set -g pane-base-index 1
set -g renumber-windows on               # авто-перенумерация при закрытии
set -g history-limit 50000               # больше скроллбека
set -sg escape-time 0                    # убирает задержку Escape (важно для vim)
set -g status-interval 5                 # обновление статусбара чаще

# Навигация по панелям
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window

# Сплиты — открывают в текущей директории
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload конфига
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Статусбар
set -g status-fg white
set -g status-bg black
set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg) #[fg=cyan]%H:%M'
set -g status-justify centre
set -g visual-activity on

# TPM плагины
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Настройки плагинов
set -g @continuum-restore 'off'           # автовосстановление сессий при старте
set -g @resurrect-capture-pane-contents 'on'


set-window-option -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"


set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

set-option -g update-environment "DISPLAY"

unbind-key -T root MouseDown3Pane
unbind-key -T root MouseDown3Status
unbind-key -T root MouseDown3StatusLeft


# Инициализация TPM (всегда последняя строка!)
run '~/.tmux/plugins/tpm/tpm'

